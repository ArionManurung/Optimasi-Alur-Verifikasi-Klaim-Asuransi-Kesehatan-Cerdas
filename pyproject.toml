[project]
name = "asuransii"
version = "0.1.0"
description = "Sistem Verifikasi Klaim Asuransi Kesehatan berbasis Uniform Cost Search (UCS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "networkx>=3.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
